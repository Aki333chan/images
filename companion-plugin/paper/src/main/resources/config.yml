# ============================================================================
#  AurumCompanion — плагин-компаньон панели управления
# ============================================================================
#  Плагин работает в обе стороны:
#    панель -> плагин : HTTP-сервер ниже (список игроков, инвентарь)
#    плагин -> панель : команда /ticket отправляет обращение игрока
# ============================================================================

# Общий секрет. Тот же самый токен вводится в панели в настройках модуля
# Minecraft для этого сервера (там он хранится зашифрованным).
#
# Сгенерировать: openssl rand -base64 32
# Пока здесь стоит CHANGE_ME, HTTP-сервер не запустится — это защита от
# случайного выхода в сеть с предсказуемым секретом.
token: CHANGE_ME

http:
  # Внутри контейнера Pterodactyl слушать нужно на 0.0.0.0 — наружу порт
  # выпускает allocation. Выдайте secondary allocation на приватном адресе
  # туннеля (10.0.0.2) и закройте порт файрволом: этот порт так же чувствителен,
  # как RCON — доступ к нему равносилен доступу к инвентарям игроков.
  bind: "0.0.0.0"
  # Должен совпадать с secondary allocation в Pterodactyl.
  port: 8085

panel:
  # Внутренний адрес панели через туннель. Публичный домен здесь не нужен —
  # трафик не должен выходить наружу.
  base-url: "http://10.0.0.1:3001"
  # UUID сервера в панели: виден в адресной строке на странице сервера
  # (…/servers/<этот-id>).
  server-id: ""

tickets:
  # Пауза между командами /ticket от одного игрока, секунды.
  cooldown-seconds: 10
