# ============================================================================
#  AurumCompanion — плагин-компаньон панели управления
# ============================================================================
#  Плагин работает в обе стороны:
#    панель -> плагин : HTTP-сервер ниже (список игроков, инвентарь)
#    плагин -> панель : команда /ticket отправляет обращение игрока
# ============================================================================

# Общий секрет. Тот же самый токен вводится в панели в настройках модуля
# Minecraft для этого сервера (там он хранится зашифрованным).
#
# Сгенерировать: openssl rand -base64 32
# Пока здесь стоит CHANGE_ME, HTTP-сервер не запустится — это защита от
# случайного выхода в сеть с предсказуемым секретом.
token: CHANGE_ME

# Язык сообщений игрокам: ru, en или pl.
#
# Касается только того, что companion пишет в чат сам, — это /ticket и
# /webtoken. Ответ администрации приходит её собственными словами и ничем
# отсюда не переводится.
#
# Сами тексты — в папке lang/, по файлу на язык, и правятся руками.
# Незнакомое значение здесь означает русский.
#
# Язык ОДИН НА СЕРВЕР, а не на игрока: чат общий, и выбирать язык на каждого
# значило бы обещать то, чего протокол не даёт.
language: ru

# ВНИМАНИЕ: ниже ДВА РАЗНЫХ ПОРТА, и их регулярно путают.
#
#   http.port      — порт, который слушает САМ ПЛАГИН на игровом сервере.
#                    Его же выдают secondary allocation в Pterodactyl.
#   panel.base-url — адрес и порт ПАНЕЛИ на другой машине. К allocation
#                    игрового сервера он не имеет никакого отношения.
#
# Если вписать в base-url порт плагина, тикеты молча перестанут отправляться:
# плагин будет стучаться в собственный номер порта на чужом хосте.

http:
  # Внутри контейнера Pterodactyl слушать нужно на 0.0.0.0 — наружу порт
  # выпускает allocation. Выдайте secondary allocation на приватном адресе
  # туннеля (10.0.0.2) и закройте порт файрволом: этот порт так же чувствителен,
  # как RCON — доступ к нему равносилен доступу к инвентарям игроков.
  bind: "0.0.0.0"
  # Должен совпадать с secondary allocation в Pterodactyl.
  # ЭТО ПОРТ ПЛАГИНА. В panel.base-url его писать не надо.
  port: 8085

panel:
  # Внутренний адрес ПАНЕЛИ через туннель. Публичный домен здесь не нужен —
  # трафик не должен выходить наружу.
  #
  # Порт — тот, что стоит в API_PORT панели (по умолчанию 3001), а НЕ порт
  # плагина выше. Проверить на VDS: ss -tulpn | grep 3001
  base-url: "http://10.0.0.1:3001"
  # UUID сервера в панели: виден в адресной строке на странице сервера
  # (…/servers/<этот-id>).
  server-id: ""

tickets:
  # Пауза между командами /ticket от одного игрока, секунды.
  cooldown-seconds: 10

# Optional Fabric client integration. It uses the Minecraft connection and
# does not need the HTTP token, panel port or a public network allocation.
ui:
  enabled: true
  refresh-ticks: 10
  max-payload-bytes: 24576
  panel-metadata-keys:
    - aurumui.arena
    - aurumui.guilds
    - aurumui.party
