name: AurumCompanion
version: '${version}'
main: ovh.aurumgg.companion.paper.AurumCompanionPlugin
# Формат версии Paper с 26.1: год.выпуск (раньше было 1.21.x).
api-version: '26.2'
description: Companion-плагин Aurum Panel — инвентарь, список игроков и тикеты игроков.
author: Aurum
# Мягкие зависимости: если плагина нет, наш всё равно грузится, просто
# соответствующие возможности не появляются.
#   LuckPerms      — вкладка «Права» (чтение и изменение через его API)
#   InvSeePlusPlus — инвентари игроков, которых нет в сети
#   Vault          — блок «Валюта»: баланс, начисления и списания. Сам Vault
#                    денег не хранит: за ним должен стоять плагин экономики,
#                    зарегистрировавший провайдера Economy.
#   AurumAuth      — «вошёл ли игрок» для /webtoken. Без него companion
#                    работает, но подтвердить вход не у кого.
# Имена именно такие, как их регистрируют сами плагины: InvSee++ зовётся
# InvSeePlusPlus, а EssentialsX — Essentials (ему softdepend не нужен,
# с ним работаем командами через RCON).
softdepend: [LuckPerms, InvSeePlusPlus, Vault, AurumAuth]
commands:
  ticket:
    description: Отправить сообщение администрации
    usage: /ticket <сообщение>
  webtoken:
    description: Одноразовый код для входа в панель
    usage: /webtoken
