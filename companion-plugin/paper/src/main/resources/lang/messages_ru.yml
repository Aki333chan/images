# Тексты, которые видит игрок. Русский.
#
# У companion их немного: он в основном мост между панелью и сервером, а не
# плагин с интерфейсом. Всё, что здесь есть, — это /ticket и /webtoken.
#
# Файл можно править руками; изменения подхватываются при перезапуске сервера.
# Подстановки в фигурных скобках ({code}, {seconds}) оставлять обязательно:
# без них из сообщения пропадает то, ради чего оно и написано.
#
# Удалять строки не надо: пропавшая берётся из встроенного русского, и правка
# просто не применится.

# --------------------------------------------------------------- /ticket
ticket:
  playersOnly: "Команда доступна только игрокам."
  notConfigured: "Тикеты не настроены на этом сервере."
  # Подсказка говорит и как набрать, и что произойдёт: иначе половина игроков
  # пишет второй тикет, решив, что первый никуда не ушёл.
  usage: "/{command} <сообщение> — написать администрации; ответ придёт сюда же, в чат"
  cooldown: "Подожди ещё {seconds} с перед следующим сообщением."
  created: "Тикет создан. Администрация ответит здесь же, в чате."
  appended: "Сообщение добавлено к твоему тикету."
  failed: "Не получилось отправить — попробуй позже."

# ------------------------------------------------------------- /webtoken
webtoken:
  playersOnly: "Команда только для игроков"
  loginFirst: "Сначала войдите: /login <пароль>"
  code: "Код для входа в панель: {code}"
  codeHint: "Он одноразовый и действует несколько минут."
