# Гильдии и пати Aurum.
#
# Значения вне разумных границ плагин зажимает при старте — сервер не останется
# с тегом в ноль символов или пати на одного человека из-за опечатки.

database:
  # ОДНА БАЗА НА ОДИН СЕРВЕР. В отличие от базы авторизации, эту не стоит делить
  # между несколькими серверами сети: гильдии живут в памяти плагина (иначе HUD
  # и чат упирались бы в базу на каждом кадре), а механизма оповестить соседний
  # сервер об изменении здесь нет — он продолжил бы показывать состав, который
  # уже поменялся.
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/aurum_guilds"
  username: "aurum"
  password: ""
  # Префикс имён таблиц. Будут созданы: <префикс>, <префикс>_members,
  # <префикс>_bank_log.
  table-prefix: "aurum_guilds"
  # Пул соединений. Гильдии меняются редко, большой пул здесь ни к чему.
  pool-size: 4

guild:
  # Нужно ли право aurumguilds.create, чтобы завести гильдию.
  # false — может любой игрок.
  require-create-permission: false

  max-name-length: 24
  # Тег висит рядом с ником в каждом сообщении чата. Четыре символа —
  # общепринятый предел; шесть уже заметно отодвигают сам текст сообщения.
  max-tag-length: 4
  max-members: 50
  # Сколько живёт приглашение в гильдию. В гильдию зовут вдумчивее, чем в пати
  # на один бой, поэтому срок больше.
  invite-seconds: 300

party:
  max-members: 8
  # Приглашение в пати живёт минуту-две: дольше — и человек уже забыл, куда его
  # звали, а принятое через час приглашение выглядит как чужая ошибка.
  invite-seconds: 90

# Сайдбар справа сверху: состав пати с индикаторами здоровья и блок гильдии.
#
# ПРО ЧУЖИЕ САЙДБАРЫ. Слот на сервере один, и если его занял другой плагин
# (например, GladiatorArena во время боя), мы не спорим за него: сайдбар просто
# не показывается, а когда слот освободится, возвращается сам. Перезапись
# превратила бы оба сайдбара в мигание.
hud:
  enabled: true
  # Чаще раза в полсекунды обновлять нечего: HP и состав так быстро не меняются,
  # а каждое обновление — это пакеты всем, кому сайдбар показан.
  refresh-ms: 1000
  title: "&6&lAurum"

# Тег гильдии суффиксом к нику — через LuckPerms, полностью автоматически.
# Без LuckPerms этот раздел ни на что не влияет.
luckperms:
  # Префикс ТЕХНИЧЕСКИХ имён групп. Имя группы собирается как <префикс><id
  # гильдии> — например guild_17. Из id, а не из тега: тег меняется и содержит
  # что угодно, вплоть до кириллицы, а имя группы должно быть постоянным и
  # безопасным.
  #
  # Игрокам и лидерам никаких команд LuckPerms вводить не нужно: группа
  # заводится при создании гильдии, участники получают наследование при
  # вступлении, суффикс приходит им сам.
  group-prefix: "guild_"
  # Во что оборачивается тег. {tag} — сам тег.
  suffix-format: "&7[&b{tag}&7]"

bank:
  # Общий банк гильдии. Работает только при установленном Vault — своей валюты
  # плагин не заводит намеренно: вторая экономика на сервере, где уже есть одна,
  # это гарантированный вопрос «а почему в гильдии деньги другие».
  #
  # Вкладывать может любой участник, снимать — по настройке гильдии
  # (/guild settings). Каждая операция пишется в таблицу <префикс>_bank_log и
  # оттуда не удаляется никогда: вопрос «куда делись деньги из общака» возникает
  # через неделю, а не в момент операции.
  enabled: true
