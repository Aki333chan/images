# ------------------------------------------------------------------ help
help:
  next: "&8Next: &e{command} {page}"
  counter: "&7(page {page} of {total})"

# ------------------------------------------------------------ durations
#
# Units are abbreviated on purpose: spelled-out words would have to agree with
# the number, and abbreviations never do. {n} is the amount, {m} the minutes in
# "2 h 30 min", {h} the hours in "3 d 4 h".
time:
  forever: "forever"
  s: "{n} s"
  min: "{n} min"
  h: "{n} h"
  hMin: "{n} h {m} min"
  d: "{n} d"
  dH: "{n} d {h} h"

