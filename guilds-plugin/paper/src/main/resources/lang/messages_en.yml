# --------------------------------------------------------- private channels
chat:
  party:
    label: "&b[Party]"
  guild:
    label: "&a[Guild]"
  err:
    playersOnly: "This chat is for players in game"
    aloneOnline: "Nobody else from the group is online right now"

# ------------------------------------------------------------- chat prompt
prompt:
  howTo: "Type the new value in chat, or «{cancel}» to change your mind."
  # The cancel word is TYPED, not read. «cancel» is always accepted; this key
  # adds the word of the server's own language on top of it.
  cancelWord: "cancel"
  cancelled: "Cancelled"

# ------------------------------------------------------------ settings menu
menu:
  title: "&8Guild settings"
  enabled: "allowed"
  disabled: "off"
  notSet: "not set"
  clickToggle: "Click to switch"
  clickChange: "Click to change"
  friendlyFire:
    title: "&fFriendly fire: {value}"
    # A list, because these are the lines under the icon: where to break them
    # is the translation's call, not the code's.
    lore:
      - "Whether guild members"
      - "can hit each other."
  joinPolicy:
    title: "&fJoining: {value}"
    lore:
      - "Open — anyone walks in."
      - "By invite — only those asked."
      - "Closed — nobody at all."
  motd:
    title: "&fGuild description"
    ask: "New guild description:"
  bankAccess:
    title: "&fWithdraw from the bank: {value}"
    lore:
      - "Any member can pay in —"
      - "it is their own money."
      - "Only spending is configurable."
  tag:
    title: "&fGuild tag: &b[{tag}]"
    ask: "New guild tag:"
    lore:
      - "Shown next to every member's name."
      - "Up to {max} characters, must be free."

