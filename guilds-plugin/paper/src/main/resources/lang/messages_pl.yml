help:
  next: "&8Dalej: &e{command} {page}"
  counter: "&7(str. {page} z {total})"

# ------------------------------------------------------------ czas trwania
#
# Jednostki skrótami i to nie jest oszczędność miejsca: pełne słowa trzeba by
# odmieniać przez liczbę («2 godziny», «5 godzin»), a skróty się nie odmieniają.
# {n} — liczba, {m} — minuty w «2 godz. 30 min», {h} — godziny w «3 dn. 4 godz.».
time:
  forever: "na zawsze"
  s: "{n} s"
  min: "{n} min"
  h: "{n} godz."
  hMin: "{n} godz. {m} min"
  d: "{n} dn."
  dH: "{n} dn. {h} godz."

