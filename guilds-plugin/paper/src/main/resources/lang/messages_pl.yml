# Komunikaty widziane przez gracza. Polski.
#
# Plik można edytować ręcznie: zmiany wczytuje /guild admin reload, przebudowa
# pluginu nie jest potrzebna. Zostaw {podstawienia} — bez nich z komunikatu
# znika imię, dla którego go napisano. Nieznane podstawienie zostaje na czacie
# takie, jakie jest, więc literówkę widać od razu.
#
# Nie usuwaj wierszy: brakujący klucz jest brany z wbudowanego rosyjskiego.

# Podpis, od którego zaczyna się każda wiadomość pluginu. Kody kolorów: &.
prefix: "&6[&eGildie&6]&r "

# --------------------------------------------------- rangi i rodzaje bonusów
#
# PANEL ZNA TE SAME NAZWY KLUCZY. Plugin podstawia je w języku serwera, panel
# w języku tego, kto patrzy. Dodać bonus znaczy dopisać wiersz w dwóch
# miejscach, a nie prowadzić drugą tablicę odpowiedników.
mc:
  rank:
    leader: "lider"
    officer: "oficer"
    member: "członek"
  bonus:
    miningSpeed: "Szybkość kopania"
    movementSpeed: "Szybkość poruszania"
    blockDrops: "Łup z bloków"
    mobDrops: "Łup z mobów"
    experience: "Doświadczenie"
    # Wielkość bonusu-efektu słowami.
    level: "poziom {n}"
    # Krótkie do sidebara: pełna nazwa się nie mieści, a pierwsze ucieka
    # właśnie pozostałe czasu, dla którego wiersz istnieje.
    short:
      miningSpeed: "Pośpiech"
      movementSpeed: "Szybkość"
      blockDrops: "Bloki"
      mobDrops: "Moby"
      experience: "PD"

