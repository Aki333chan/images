      use: "/p <wiadomość>"
      what: "napisać do swojej drużyny; postronni tego nie zobaczą"

  claim:
    title: "Dom gildii"

  guild:
    title: "Gildie"
    create:
      use: "/guild create <nazwa> <tag>"
      what: "założyć gildię; tag to krótka etykieta przy nicku, 2-5 znaków"
    join:
      use: "/guild join [nazwa]"
      what: "dołączyć — na zaproszenie albo wprost do otwartej gildii"
    leave:
      use: "/guild leave"
      what: "wyjść ze swojej gildii"
    info:
      use: "/guild info [nazwa]"
      what: "skład, rangi i bank — swojej gildii albo cudzej"
    list:
      use: "/guild list [szukaj]"
      what: "wszystkie gildie serwera"
    invite:
      use: "/guild invite <nick>"
      what: "zaprosić gracza do gildii; zapraszać mogą lider i oficerowie"
    kick:
      use: "/guild kick <nick>"
      what: "wyrzucić członka; tylko kogoś niższego rangą od ciebie"
    promote:
      use: "/guild promote <nick>"
      what: "mianować oficerem — będzie mógł zapraszać i wyrzucać (lider)"
    demote:
      use: "/guild demote <nick>"
      what: "zdjąć oficera z powrotem do członka (lider)"
    transfer:
      use: "/guild transfer <nick>"
      what: "oddać gildię innemu; zostaniesz w niej oficerem"
    disband:
      use: "/guild disband"
      what: "rozwiązać gildię — zapyta o potwierdzenie"
    tag:
      use: "/guild tag <nowy tag>"
      what: "zmienić etykietę przy nicku; 2-5 znaków, bez kodów koloru (lider)"
    settings:
      use: "/guild settings"
      what: "menu ustawień: opis, przyjmowanie, ogień do swoich"
    bank:
      use: "/guild bank"
      what: "stan banku; deposit i withdraw — wpłacić i wypłacić"
      deposit:
        what: "przełożyć własne pieniądze do banku — może każdy członek"
      withdraw:
        what: "wziąć z banku; kto może, decyduje /guild settings"
    bonuses:
      use: "/guild bonuses"
      what: "jakie wzmocnienia działają na gildię i jak długo jeszcze"
    claim:
      use: "/guild claim <region>"
      what: "wpuścić do swojego regionu całą gildię — dom gildii"
    claimRemove:
      use: "/guild claim remove <region>"
      what: "odłączyć region od gildii; członków usuniemy z niego sami"
    chat:
      use: "/g <wiadomość>"
      what: "napisać do swojej gildii; postronni tego nie zobaczą"

  admin:
    title: "Gildie — administracja"
    remove:
      use: "/guild admin remove <nick>"
      what: "wyrzucić gracza z jego gildii"
    transfer:
      use: "/guild admin transfer <gildia> <nick>"
      what: "mianować liderem innego członka tej gildii"
    disband:
      use: "/guild admin disband <gildia>"
      what: "rozwiązać cudzą gildię"
    bonusList:
      use: "/guild admin bonus list <gildia>"
      what: "co teraz działa na tę gildię"
    bonusGrant:
      use: "/guild admin bonus grant <rodzaj> <wielkość> [30m|2h|7d] <gildia>"
      what: "przyznać wzmocnienie; bez terminu — na zawsze"
    bonusRevoke:
      use: "/guild admin bonus revoke <rodzaj> <gildia>"
      what: "zdjąć wzmocnienie"
    friendlyFire:
      use: "/guild admin friendlyfire [on|off]"
      what: "ogień do swoich w drużynie, dla całego serwera"
    reload:
      use: "/guild admin reload"
      what: "przeczytać config.yml ponownie bez restartu"

# ------------------------------------------------------------ czas trwania
#
# Jednostki skrótami i to nie jest oszczędność miejsca: pełne słowa trzeba by
# odmieniać przez liczbę («2 godziny», «5 godzin»), a skróty się nie odmieniają.
# {n} — liczba, {m} — minuty w «2 godz. 30 min», {h} — godziny w «3 dn. 4 godz.».
time:
  forever: "na zawsze"
  s: "{n} s"
  min: "{n} min"
  h: "{n} godz."
  hMin: "{n} godz. {m} min"
  d: "{n} dn."
  dH: "{n} dn. {h} godz."

