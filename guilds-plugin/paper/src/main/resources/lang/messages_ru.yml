      use: "/guild join [имя]"
      what: "вступить — по приглашению или в открытую гильдию"
    leave:
      use: "/guild leave"
      what: "выйти из своей гильдии"
    info:
      use: "/guild info [имя]"
      what: "состав, ранги и общак — свой или чужой гильдии"
    list:
      use: "/guild list [поиск]"
      what: "все гильдии сервера"
    invite:
      use: "/guild invite <ник>"
      what: "позвать игрока в гильдию; звать могут лидер и офицеры"
    kick:
      use: "/guild kick <ник>"
      what: "выгнать участника; только того, кто ниже вас по рангу"
    promote:
      use: "/guild promote <ник>"
      what: "сделать офицером — он сможет звать и выгонять (лидер)"
