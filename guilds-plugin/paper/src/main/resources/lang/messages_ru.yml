# Тексты, которые видит игрок. Русский.
#
# Файл можно править руками: изменения подхватывает /guild admin reload,
# пересобирать плагин не нужно.
#
# Подстановки в фигурных скобках ({player}, {guild}) оставлять обязательно:
# без них из сообщения пропадает имя, ради которого оно и написано.
# Неизвестная подстановка остаётся в чате как есть — так опечатку видно сразу.
#
# Удалять строки не надо: пропавшая берётся из встроенного русского, и правка
# просто не применится.

# Подпись, с которой начинается каждое сообщение плагина. Цветовые коды — &.
prefix: "&6[&eГильдии&6]&r "

# ---------------------------------------------------- ранги и виды бонусов
#
# ТЕ ЖЕ ИМЕНА КЛЮЧЕЙ ЗНАЕТ ПАНЕЛЬ. Плагин подставляет их на языке сервера,
# панель — на языке того, кто смотрит. Добавить бонус значит дописать строку
# в двух местах, а не заводить вторую таблицу соответствий.
mc:
  rank:
    leader: "лидер"
    officer: "офицер"
    member: "участник"
  bonus:
    miningSpeed: "Скорость добычи"
    movementSpeed: "Скорость передвижения"
    blockDrops: "Добыча из блоков"
    mobDrops: "Добыча с мобов"
    experience: "Опыт"
    # Величина бонуса-эффекта словами.
    level: "уровень {n}"
    # Короткие — для сайдбара: полное название туда не влезает, и первым
    # уезжает как раз остаток времени, ради которого строка и показывается.
    short:
      miningSpeed: "Спешка"
      movementSpeed: "Скорость"
      blockDrops: "Блоки"
      mobDrops: "Мобы"
      experience: "Опыт"

# ------------------------------------------------------------- сайдбар
hud:
  party: "Пати"
  guild: "Гильдия"
  rank: "Ранг"
  online: "В сети"
  bank: "Банк"
  bonuses: "Бонусы"
  more: "… и ещё {count}"
  # Односимвольные единицы времени: «6д», «3ч», «12м». В сайдбаре каждый знак
  # на счету.
  d: "д"
  h: "ч"
  m: "м"
  lessThanMinute: "<1м"

