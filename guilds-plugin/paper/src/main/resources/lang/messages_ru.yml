      use: "/guild demote <ник>"
      what: "снять офицера обратно в участники (лидер)"
    transfer:
      use: "/guild transfer <ник>"
      what: "отдать гильдию другому; вы останетесь в ней офицером"
    disband:
      use: "/guild disband"
      what: "распустить гильдию — спросит подтверждение"
    tag:
      use: "/guild tag <новый тег>"
      what: "сменить метку у ника; 2-5 знаков, без цветовых кодов (лидер)"
    settings:
      use: "/guild settings"
      what: "меню настроек: описание, приём заявок, PvP своих"
    bank:
      use: "/guild bank"
      what: "остаток общака; deposit и withdraw — внести и снять"
      deposit:
        what: "переложить свои деньги в общак — может любой участник"
      withdraw:
        what: "взять из общака; кому это можно, решает /guild settings"
    bonuses:
      use: "/guild bonuses"
      what: "какие усиления действуют на гильдию и сколько ещё"
    claim:
      use: "/guild claim <регион>"
      what: "пустить в свой приват всю гильдию — дом гильдии"
    claimRemove:
      use: "/guild claim remove <регион>"
      what: "отвязать регион от гильдии; участников уберём из него сами"
    chat:
      use: "/g <сообщение>"
      what: "написать своей гильдии; посторонние этого не увидят"

  admin:
    title: "Гильдии — администрирование"
    remove:
      use: "/guild admin remove <ник>"
      what: "выгнать игрока из его гильдии"
    transfer:
      use: "/guild admin transfer <гильдия> <ник>"
      what: "назначить лидером другого участника этой гильдии"
