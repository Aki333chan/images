      what: "что сейчас действует на эту гильдию"
    bonusGrant:
      use: "/guild admin bonus grant <вид> <величина> [30m|2h|7d] <гильдия>"
      what: "выдать усиление; без срока — навсегда"
    bonusRevoke:
      use: "/guild admin bonus revoke <вид> <гильдия>"
      what: "снять усиление"
    friendlyFire:
      use: "/guild admin friendlyfire [on|off]"
      what: "урон своим в пати, для всего сервера"
    reload:
      use: "/guild admin reload"
      what: "перечитать config.yml без перезапуска"

# ------------------------------------------------------------ сроки
#
# Единицы — сокращениями, и это не экономия места: полные слова пришлось бы
# склонять по числу («2 часа», «5 часов»), а сокращения не склоняются.
# {n} — число, {m} — минуты в «2 ч 30 мин», {h} — часы в «3 д 4 ч».
time:
  forever: "навсегда"
  s: "{n} с"
  min: "{n} мин"
  h: "{n} ч"
  hMin: "{n} ч {m} мин"
  d: "{n} д"
  dH: "{n} д {h} ч"

