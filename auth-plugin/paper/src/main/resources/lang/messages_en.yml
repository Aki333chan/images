# Player-facing messages. English.
#
# Edit this file by hand: /auth reload picks the changes up, no rebuild needed.
# Keep the {placeholders} — without them the number the message was written
# for disappears. An unknown placeholder stays in chat as-is, so a typo shows
# up immediately.
#
# Do not delete lines: a missing key falls back to the bundled Russian, so the
# edit simply would not apply. To silence a message entirely there are
# separate switches in config.yml.

auth:
  # ---------------------------------------------------------------- login
  loggedIn: "You are logged in"
  registered: "Registration complete, you are logged in"
  wrongPassword: "Wrong password"
  notRegistered: "You are not registered yet: /register <password> <password>"
  alreadyRegistered: "This nickname is already registered: /login <password>"
  mismatch: "The passwords do not match"
  serviceDown: "The authentication service is unavailable, try again later"

  # -------------------------------------------------------------- password
  passwordShort: "The password is shorter than {min} characters"
  passwordLong: "The password is longer than {max} characters"
  passwordChanged: "Password changed, you are logged in"

  # -------------------------------------------------------- brute-force
  throttled: "Too often. Try again in {seconds} s"
  locked: "Too many failed attempts. Login is closed for {minutes} min"

  # ---------------------------------------------------- two-factor
  totpRequired: "Enter the code from your app: /2fa <code>"
  totpInvalid: "The code did not match. Check the clock on your phone"
  totpEnabled: "Two-factor is on. The code will be asked on every login"
  totpDisabled: "Two-factor is off"
  totpAlreadyOff: "Two-factor is already off"

  # --------------------------------------------------- password reset
  resetTokenInvalid: "The token did not match or has expired"
  resetReady: "Token accepted. Choose a new password: /reset <password> <password again>"

  # ------------------------------------------------------- registration
  unregistered: "Registration removed"

# ------------------------------------------------------- the login prompt
#
# A large title across the screen, a line under it, a line above the hotbar
# and a line in chat. Being noticeable is the whole point here: a prompt that
# is seen differs from one that is not by exactly the number of people who
# left the server without understanding anything.
#
# Whether the title is shown, how often it repeats and how long it stays are
# in config.yml. Only the words live here.
prompt:
  prefix: "&6[&eLogin&6]&r "

  # The nickname is already registered — a password is needed.
  login:
    title: "&c&lLOG IN"
    subtitle: "&ftype in chat &e/login <password>"
    action-bar: "&e» &ftype &e/login <password> &7({seconds} s) &e«"
    chat: "&7This nickname is already registered. &aLog in: &f/login <password>"

  # The nickname is seen for the first time.
  register:
    title: "&a&lREGISTER"
    subtitle: "&ftype in chat &e/register <password> <password>"
    action-bar: "&e» &ftype &e/register <password> <password> &7({seconds} s) &e«"
    chat: "&aWelcome, &f{player}&a! Register: &f/register <password> <password again>"

  # The password is accepted, two-factor is left.
  totp:
    title: "&6&lCODE FROM THE APP"
    subtitle: "&ftype in chat &e/2fa <code>"
    action-bar: "&e» &ftype &e/2fa <code> &7({seconds} s) &e«"
    chat: "&6The two-factor code is left: &f/2fa <code>"

  # The reset token is accepted, waiting for a new password.
  new-password:
    title: "&b&lNEW PASSWORD"
    subtitle: "&ftype in chat &e/reset <password> <password>"
    action-bar: "&e» &ftype &e/reset <password> <password> &7({seconds} s) &e«"
    chat: "&bChoose a new password: &f/reset <password> <password again>"

# --------------------------------- own join messages and the greeting
#
# Whether to show them at all is in config.yml: on a server with EssentialsX
# they are turned off so there are no two messages in a row.
messages:
  join:
    text: "&e{player} joined"
    # Shown instead of the usual one to somebody who has just registered.
    first-time: "&6Meet a new player: &e{player}&6!"
  quit:
    text: "&e{player} left"
  motd:
    lines:
      - "&aWelcome, &f{player}&a!"
      - "&7Players online: &f{online}&7/&f{max}"

# ----------------------------------------------------------- commands
cmd:
  playersOnly: "This command is for players only"
  alreadyIn: "You are already logged in"
  reset:
    alreadyIn: "You are already logged in. A reset is only for those who forgot the password."
    tokenHint: "The token is 8 characters, an admin gives it out. If yours has already been accepted, type: /reset <password> <password again>"
  unregister:
    warn: "The account will be deleted and the nickname freed. This cannot be undone."
    done: "Registration removed. Join again to register anew."

# -------------------------------------------------------- before login
guard:
  bypass: "Logged in without a password by admin permission"
  welcomeBack: "Welcome back, no password needed"
  timeoutKick: "You did not log in within the allotted time"
  loginFirst: "Log in first"
  needLogin: "Log in first: /login <password>"
  needCode: "Enter the code first: /2fa <code>"
  needNewPassword: "Set a new password first: /reset <password> <password again>"

# ----------------------------------------------------------- two-factor
totp:
  notNeeded: "No code is needed right now. First /login <password>"
  setupFailed: "Could not start the setup"
  addToApp: "Add to Google Authenticator (or any other app):"
  openInApp: "[open in the app]"
  thenConfirm: "Then confirm: /2fa confirm <code from the app>"
  untilConfirmed: "Until you confirm, login stays password-only."

# -------------------------------------------------------- admin commands
admin:
  reloaded: "Message and prompt texts reloaded"
  noAccount: "Account “{name}” not found"
  noPermission: "Not enough permissions: {permission}"
  notOnline: "Player “{name}” is not online"
  unlocked: "The login-attempt lockout for “{name}” has been lifted"
  loggedOutPlayer: "An admin reset your login: /login <password>"
  reset:
    token: "Reset token for {player}: {token}"
    valid: "Valid for {minutes} min. The player types: /reset {token}"
  logout:
    was: "Player “{name}” was logged out, the session is cleared"
    wasNot: "Player “{name}” was not logged in anyway; the session is cleared"
  info:
    title: "Account {player}"
    registered: "Registered: {value}"
    lastLogin: "Last login: {value}"
    lastIp: "Last address: {value}"
    totp: "Two-factor: {value}"
    now: "Right now: {value}"
    never: "never"
    noData: "no data"
    totpOn: "on"
    totpOff: "off"
    offline: "offline"
  history:
    periods: "Period: {list}"
    empty: "No logins by “{name}” over {period}"
    title: "Logins by “{name}” over {period} ({count}):"
    trimmed: "Showing the last {limit} — pick a shorter period"
    success: "logged in"
    wrongPassword: "wrong password"
    wrongCode: "wrong 2FA code"
    session: "by session"
    bypass: "without a password"
    reset: "password reset"
  unregister:
    warn: "Account “{name}” will be deleted with no way to restore it."
    freed: "The nickname will be freed: anyone will be able to register it. To close the nickname, ban it separately."
    confirm: "Confirm: /auth unregister {name} confirm"
    done: "Registration of “{name}” removed"
    kick: "An admin removed your registration"
  totpOff:
    done: "Two-factor for “{name}” turned off"
    nothing: "“{name}” has no two-factor enabled, or there is no such account"

# ------------------------------------------------------------- help
#
# On the left is how to type the command, on the right what it does. The words
# of the command itself (login, register, confirm) are not translated: they
# are typed, not read.
help:
  next: "&8Next: &e{command} {page}"
  counter: "&7(page {page} of {total})"
  login:
    use: "/login <password>"
    what: "log in to your account"
  register:
    use: "/register <password> <password again>"
    what: "create an account; the password is typed twice to avoid a typo"
  unregister:
    use: "/unregister <your password>"
    what: "delete your account; after that, only /register gets you back"
  reset:
    title: "Password change"
    token:
      use: "/reset <token>"
      what: "start the change: an admin gives out the token"
    new:
      use: "/reset <password> <password again>"
      what: "set the new password after the token"
  2fa:
    title: "Two-factor authentication"
    code:
      use: "/2fa <code>"
      what: "enter the code on login — the everyday one"
    enable:
      use: "/2fa enable"
      what: "start the setup: shows the secret for the app"
    confirm:
      use: "/2fa confirm <code>"
      what: "confirm the setup with the first code from the app"
    disable:
      use: "/2fa disable <code>"
      what: "turn two-factor off"
  admin:
    title: "Authentication — administration"
    info:
      use: "/auth info <nickname>"
      what: "what is known about the account: when and from where"
    reset:
      use: "/auth reset <nickname>"
      what: "issue a one-time password-change token"
    unlock:
      use: "/auth unlock <nickname>"
      what: "lift the lockout after failed login attempts"
    logout:
      use: "/auth logout <nickname>"
      what: "throw back to the login screen and clear the session"
    history:
      use: "/auth history <nickname> [24h|3d|7d|30d]"
      what: "login history over a period"
    totpOff:
      use: "/auth 2fa-off <nickname>"
      what: "turn off two-factor for somebody who lost their phone"
    unregister:
      use: "/auth unregister <nickname> confirm"
      what: "remove the registration — requires confirm"
    reload:
      use: "/auth reload"
      what: "reload message texts without a restart"
