# Тексты, которые видит игрок. Русский.
#
# Этот файл можно править руками: изменения подхватываются командой
# /auth reload, пересобирать плагин не нужно.
#
# ЧТО МОЖНО МЕНЯТЬ. Формулировки — как угодно. Подстановки в фигурных
# скобках ({seconds}, {min}) на месте оставлять обязательно: без них из
# сообщения пропадает число, ради которого оно и написано. Неизвестная
# подстановка остаётся в чате как есть — так опечатку видно сразу.
#
# ЧЕГО ДЕЛАТЬ НЕ НАДО. Удалять строки: пропавшая подставляется из встроенного
# русского, и правка просто не применится. Чтобы сообщение не показывалось
# вовсе, есть отдельные выключатели в config.yml.

auth:
  # ---------------------------------------------------------------- вход
  loggedIn: "Вы вошли"
  registered: "Регистрация завершена, вы вошли"
  wrongPassword: "Неверный пароль"
  notRegistered: "Вы ещё не зарегистрированы: /register <пароль> <пароль>"
  alreadyRegistered: "Этот ник уже зарегистрирован: /login <пароль>"
  mismatch: "Пароли не совпадают"
  serviceDown: "Сервис авторизации недоступен, попробуйте позже"

  # --------------------------------------------------------------- пароль
  passwordShort: "Пароль короче {min} символов"
  passwordLong: "Пароль длиннее {max} символов"
  passwordChanged: "Пароль изменён, вы вошли"

  # ------------------------------------------------------- защита от подбора
  throttled: "Слишком часто. Попробуйте через {seconds} с"
  locked: "Слишком много неудачных попыток. Вход закрыт на {minutes} мин"

  # --------------------------------------------------------- двухфакторка
  totpRequired: "Введите код из приложения: /2fa <код>"
  totpInvalid: "Код не подошёл. Проверьте время на телефоне"
  totpEnabled: "Двухфакторка включена. Код будет спрашиваться при каждом входе"
  totpDisabled: "Двухфакторка выключена"
  totpAlreadyOff: "Двухфакторка и так выключена"

  # -------------------------------------------------------- сброс пароля
  resetTokenInvalid: "Токен не подошёл или истёк"
  resetReady: "Токен принят. Придумайте новый пароль: /reset <пароль> <пароль ещё раз>"

  # ------------------------------------------------------------ регистрация
  unregistered: "Регистрация удалена"
