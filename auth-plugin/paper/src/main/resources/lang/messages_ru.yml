# Тексты, которые видит игрок. Русский.
#
# Этот файл можно править руками: изменения подхватываются командой
# /auth reload, пересобирать плагин не нужно.
#
# ЧТО МОЖНО МЕНЯТЬ. Формулировки — как угодно. Подстановки в фигурных
# скобках ({seconds}, {min}) на месте оставлять обязательно: без них из
# сообщения пропадает число, ради которого оно и написано. Неизвестная
# подстановка остаётся в чате как есть — так опечатку видно сразу.
#
# ЧЕГО ДЕЛАТЬ НЕ НАДО. Удалять строки: пропавшая подставляется из встроенного
# русского, и правка просто не применится. Чтобы сообщение не показывалось
# вовсе, есть отдельные выключатели в config.yml.

auth:
  # ---------------------------------------------------------------- вход
  loggedIn: "Вы вошли"
  registered: "Регистрация завершена, вы вошли"
  wrongPassword: "Неверный пароль"
  notRegistered: "Вы ещё не зарегистрированы: /register <пароль> <пароль>"
  alreadyRegistered: "Этот ник уже зарегистрирован: /login <пароль>"
  mismatch: "Пароли не совпадают"
  serviceDown: "Сервис авторизации недоступен, попробуйте позже"

  # --------------------------------------------------------------- пароль
  passwordShort: "Пароль короче {min} символов"
  passwordLong: "Пароль длиннее {max} символов"
  passwordChanged: "Пароль изменён, вы вошли"

  # ------------------------------------------------------- защита от подбора
  throttled: "Слишком часто. Попробуйте через {seconds} с"
  locked: "Слишком много неудачных попыток. Вход закрыт на {minutes} мин"

  # --------------------------------------------------------- двухфакторка
  totpRequired: "Введите код из приложения: /2fa <код>"
  totpInvalid: "Код не подошёл. Проверьте время на телефоне"
  totpEnabled: "Двухфакторка включена. Код будет спрашиваться при каждом входе"
  totpDisabled: "Двухфакторка выключена"
  totpAlreadyOff: "Двухфакторка и так выключена"

  # -------------------------------------------------------- сброс пароля
  resetTokenInvalid: "Токен не подошёл или истёк"
  resetReady: "Токен принят. Придумайте новый пароль: /reset <пароль> <пароль ещё раз>"

  # ------------------------------------------------------------ регистрация
  unregistered: "Регистрация удалена"

# ------------------------------------------------------- просьба войти
#
# Крупная надпись на весь экран, строка под ней, строка над горячей панелью и
# строка в чат. Заметность здесь — не украшательство: подсказка, которую
# видно, отличается от подсказки, которой нет, ровно на количество людей,
# ушедших с сервера, ничего не поняв.
#
# Показывать ли title, как часто повторять и сколько он висит — в config.yml.
# Здесь только слова.
prompt:
  prefix: "&6[&eВход&6]&r "

  # Ник уже зарегистрирован — нужен пароль.
  login:
    title: "&c&lВОЙДИТЕ"
    subtitle: "&fнапишите в чат &e/login <пароль>"
    action-bar: "&e» &fнапишите &e/login <пароль> &7({seconds} с) &e«"
    chat: "&7Этот ник уже зарегистрирован. &aВойдите: &f/login <пароль>"

  # Ник видят впервые.
  register:
    title: "&a&lРЕГИСТРАЦИЯ"
    subtitle: "&fнапишите в чат &e/register <пароль> <пароль>"
    action-bar: "&e» &fнапишите &e/register <пароль> <пароль> &7({seconds} с) &e«"
    chat: "&aДобро пожаловать, &f{player}&a! Зарегистрируйтесь: &f/register <пароль> <пароль ещё раз>"

  # Пароль принят, осталась двухфакторка.
  totp:
    title: "&6&lКОД ИЗ ПРИЛОЖЕНИЯ"
    subtitle: "&fнапишите в чат &e/2fa <код>"
    action-bar: "&e» &fнапишите &e/2fa <код> &7({seconds} с) &e«"
    chat: "&6Остался код двухфакторки: &f/2fa <код>"

  # Токен сброса принят, ждём новый пароль.
  new-password:
    title: "&b&lНОВЫЙ ПАРОЛЬ"
    subtitle: "&fнапишите в чат &e/reset <пароль> <пароль>"
    action-bar: "&e» &fнапишите &e/reset <пароль> <пароль> &7({seconds} с) &e«"
    chat: "&bПридумайте новый пароль: &f/reset <пароль> <пароль ещё раз>"

# ------------------------------------- свои сообщения о входе и приветствие
#
# Показывать ли их вообще — в config.yml: на сервере с EssentialsX их
# выключают, чтобы не было двух сообщений подряд.
messages:
  join:
    text: "&e{player} присоединился"
    # Показывается вместо обычного тому, кто только что зарегистрировался.
    first-time: "&6Встречайте нового игрока: &e{player}&6!"
  quit:
    text: "&e{player} вышел"
  motd:
    lines:
      - "&aДобро пожаловать, &f{player}&a!"
      - "&7Сейчас на сервере: &f{online}&7/&f{max}"

# ------------------------------------------------------------ команды
cmd:
  playersOnly: "Команда только для игроков"
  alreadyIn: "Вы уже вошли"
  reset:
    alreadyIn: "Вы уже вошли. Сброс нужен только тем, кто не помнит пароль."
    tokenHint: "Токен — это 8 знаков, его выдаёт администратор. Если он у вас уже принят, введите: /reset <пароль> <пароль ещё раз>"
  unregister:
    warn: "Аккаунт будет удалён, ник освободится. Отменить это нельзя."
    done: "Регистрация удалена. Зайдите снова, чтобы зарегистрироваться заново."

# --------------------------------------------------------- до входа
guard:
  bypass: "Вход без пароля по праву администратора"
  welcomeBack: "С возвращением, пароль не нужен"
  timeoutKick: "Вы не вошли за отведённое время"
  loginFirst: "Сначала войдите"
  needLogin: "Сначала войдите: /login <пароль>"
  needCode: "Сначала введите код: /2fa <код>"
  needNewPassword: "Сначала задайте новый пароль: /reset <пароль> <пароль ещё раз>"

# --------------------------------------------------- двухфакторка
totp:
  notNeeded: "Код сейчас не нужен. Сначала /login <пароль>"
  setupFailed: "Не удалось начать настройку"
  addToApp: "Добавьте в Google Authenticator (или любое другое приложение):"
  openInApp: "[открыть в приложении]"
  thenConfirm: "Затем подтвердите: /2fa confirm <код из приложения>"
  untilConfirmed: "Пока не подтвердите — вход остаётся по одному паролю."

# ------------------------------------------------- команды администратора
admin:
  reloaded: "Тексты сообщений и подсказок перечитаны"
  noAccount: "Аккаунт «{name}» не найден"
  noPermission: "Недостаточно прав: {permission}"
  notOnline: "Игрока «{name}» нет в сети"
  unlocked: "Блокировка по попыткам входа для «{name}» снята"
  loggedOutPlayer: "Вход сброшен администратором: /login <пароль>"
  reset:
    token: "Токен сброса для {player}: {token}"
    valid: "Действует {minutes} мин. Игрок вводит: /reset {token}"
  logout:
    was: "Игрок «{name}» разавторизован, сессия погашена"
    wasNot: "Игрок «{name}» и так не был авторизован; сессия погашена"
  info:
    title: "Аккаунт {player}"
    registered: "Зарегистрирован: {value}"
    lastLogin: "Последний вход: {value}"
    lastIp: "Последний адрес: {value}"
    totp: "Двухфакторка: {value}"
    now: "Сейчас: {value}"
    never: "никогда"
    noData: "нет данных"
    totpOn: "включена"
    totpOff: "выключена"
    offline: "не в сети"
  history:
    periods: "Период: {list}"
    empty: "За {period} входов игрока «{name}» не было"
    title: "Входы «{name}» за {period} ({count}):"
    trimmed: "Показаны последние {limit} — возьмите период поменьше"
    success: "вошёл"
    wrongPassword: "неверный пароль"
    wrongCode: "неверный код 2FA"
    session: "по сессии"
    bypass: "без пароля"
    reset: "сброс пароля"
  unregister:
    warn: "Аккаунт «{name}» будет удалён без возможности восстановления."
    freed: "Ник при этом освободится: зарегистрировать его сможет любой. Если нужно закрыть ник — забаньте отдельно."
    confirm: "Подтвердите: /auth unregister {name} confirm"
    done: "Регистрация «{name}» снята"
    kick: "Ваша регистрация снята администратором"
  totpOff:
    done: "Двухфакторка «{name}» выключена"
    nothing: "У «{name}» двухфакторка не включена или аккаунта нет"

# --------------------------------------------------------------- справка
#
# Слева — как набирать команду, справа — что она делает. Слова самой команды
# (login, register, confirm) не переводятся: их набирают, а не читают.
help:
  next: "&8Дальше: &e{command} {page}"
  counter: "&7(стр. {page} из {total})"
  login:
    use: "/login <пароль>"
    what: "войти под своим аккаунтом"
  register:
    use: "/register <пароль> <пароль ещё раз>"
    what: "завести аккаунт; пароль вводится дважды, чтобы не опечататься"
  unregister:
    use: "/unregister <ваш пароль>"
    what: "удалить свой аккаунт; вход после этого — только заново через /register"
  reset:
    title: "Смена пароля"
    token:
      use: "/reset <токен>"
      what: "начать смену: токен выдаёт администратор"
    new:
      use: "/reset <пароль> <пароль ещё раз>"
      what: "задать новый пароль после токена"
  2fa:
    title: "Двухфакторная авторизация"
    code:
      use: "/2fa <код>"
      what: "ввести код при входе — то, что нужно каждый день"
    enable:
      use: "/2fa enable"
      what: "начать подключение: покажет секрет для приложения"
    confirm:
      use: "/2fa confirm <код>"
      what: "подтвердить подключение первым кодом из приложения"
    disable:
      use: "/2fa disable <код>"
      what: "выключить двухфакторку"
  admin:
    title: "Авторизация — администрирование"
    info:
      use: "/auth info <ник>"
      what: "что известно об аккаунте: когда и откуда заходил"
    reset:
      use: "/auth reset <ник>"
      what: "выдать одноразовый токен смены пароля"
    unlock:
      use: "/auth unlock <ник>"
      what: "снять блокировку после неудачных попыток входа"
    logout:
      use: "/auth logout <ник>"
      what: "выкинуть на экран входа и погасить сессию"
    history:
      use: "/auth history <ник> [24h|3d|7d|30d]"
      what: "история входов за период"
    totpOff:
      use: "/auth 2fa-off <ник>"
      what: "выключить двухфакторку потерявшему телефон"
    unregister:
      use: "/auth unregister <ник> confirm"
      what: "снять регистрацию — потребует confirm"
    reload:
      use: "/auth reload"
      what: "перечитать тексты сообщений без перезапуска"
