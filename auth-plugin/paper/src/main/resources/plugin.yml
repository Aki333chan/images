name: AurumAuth
version: '${version}'
main: ovh.aurumgg.auth.paper.AurumAuthPlugin
# Формат версии Paper с 26.1: год.выпуск (раньше было 1.21.x).
api-version: '26.2'
description: Авторизация игроков на смешанном сервере — своя, вместо AuthMe.
author: Aurum

# ЗАГРУЖАЕМСЯ РАНЬШЕ ВСЕХ, КОГО ЗНАЕМ.
#
# load: STARTUP и loadbefore нужны не ради приоритета событий (он задаётся в
# аннотациях), а ради порядка регистрации: слушатели, зарегистрированные на
# одном приоритете, вызываются в порядке регистрации плагинов. Мы хотим быть
# первыми среди равных.
#
# Companion в loadbefore, чтобы к моменту его старта сервис AurumAuthApi уже
# был зарегистрирован в ServicesManager.
load: STARTUP
loadbefore: [AurumCompanion]

# EssentialsX в softdepend НЕ ставится намеренно. Порядок загрузки на разведение
# приоритетов не влияет — оно целиком в аннотациях @EventHandler, — а лишняя
# зависимость сделала бы старт этого плагина зависимым от чужого. Плагин
# полностью работоспособен и без EssentialsX: свои сообщения о входе-выходе и
# приветствие у него есть собственные (раздел messages в config.yml).

commands:
  login:
    description: Войти под своим паролем
    usage: /login <пароль>
    aliases: [l]
  register:
    description: Зарегистрироваться
    usage: /register <пароль> <пароль ещё раз>
    aliases: [reg]
  reset:
    description: Сбросить пароль по токену от администратора
    usage: /reset <токен> — затем /reset <пароль> <пароль ещё раз>
  2fa:
    description: Двухфакторная авторизация по коду из приложения
    usage: /2fa <код> | /2fa enable | /2fa confirm <код> | /2fa disable <код>
  unregister:
    description: Удалить свою регистрацию
    usage: /unregister <ваш пароль>
  auth:
    description: Администрирование авторизации
    usage: /auth reset|info|unlock|logout|history|unregister|2fa-off <ник> | /auth reload
    permission: aurumauth.admin

permissions:
  # Зонтичное право: у кого оно есть, тому доступны все подкоманды /auth.
  aurumauth.admin:
    description: Доступ к команде /auth
    default: op
    children:
      aurumauth.admin.reset: true
      aurumauth.admin.info: true
      aurumauth.admin.unlock: true
      aurumauth.admin.logout: true
      aurumauth.admin.history: true
      aurumauth.admin.unregister: true
      aurumauth.admin.2fa: true
      aurumauth.admin.reload: true
  aurumauth.admin.reset:
    description: Выдавать токены сброса пароля
    default: op
  aurumauth.admin.info:
    description: Смотреть сведения об аккаунте
    default: op
  aurumauth.admin.info.ip:
    description: Видеть в /auth info адрес последнего входа
    # НЕ входит в зонтичное aurumauth.admin намеренно: адрес игрока — сведения
    # о человеке, а не о сервере, и выдавать их вместе с остальным
    # администрированием не стоит. Право даётся отдельно и осознанно.
    default: false
  aurumauth.admin.unlock:
    description: Снимать блокировку по неудачным попыткам входа
    default: op
  aurumauth.admin.logout:
    description: Разавторизовывать игроков
    default: op
  aurumauth.admin.history:
    description: Смотреть историю входов игрока
    default: op
  aurumauth.admin.unregister:
    description: Снимать регистрацию с игроков
    default: op
  aurumauth.admin.2fa:
    description: Выключать двухфакторку игрокам (потерянный телефон)
    default: op
  aurumauth.admin.reload:
    description: Перечитывать тексты сообщений и экранных подсказок
    default: op
  aurumauth.bypass:
    description: Входить без пароля. ОПАСНО на offline-сервере — см. config.yml
    # default: false и ни в каких children: это право нельзя получить случайно,
    # вместе с чем-то ещё. Плюс оно ничего не делает, пока в конфиге не включён
    # login.permission-bypass.
    default: false
