# Авторизация Aurum.
#
# Значения вне разумных границ плагин зажимает при старте и пишет об этом в
# лог — сервер не останется с таймаутом входа в ноль секунд из-за опечатки.

database:
  # Одна база на все серверы сети даёт сквозной вход: зарегистрировался на
  # выживании — зашёл на креатив тем же паролем. Ключ — UUID, он везде один.
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/aurum_auth"
  username: "aurum"
  password: ""
  table: "auth_accounts"
  # Размер пула соединений. Больше десятка нужно разве что при сотнях
  # одновременных заходов: соединение занято только на время запроса.
  pool-size: 6

login:
  # Сколько секунд даётся на ввод пароля до кика.
  timeout-seconds: 60
  # Окно сессии: переподключился в течение этого времени с того же адреса —
  # пароль не спрашиваем. 0 выключает сессии совсем.
  session-minutes: 15
  min-password-length: 8
  max-password-length: 64
  # Лёгкая защита от подбора. Полноценный антибот здесь не нужен — он стоит
  # на сетевом уровне; это просто базовая гигиена по конкретному аккаунту.
  max-attempts: 5
  lockout-minutes: 5
  attempt-delay-ms: 250
  # Стоимость bcrypt. 12 — примерно четверть секунды на ядро. Проверка идёт
  # вне главного потока, но выше 14 вход начинает ощущаться и так.
  bcrypt-cost: 12

premium:
  # Спрашивать у Mojang, существует ли лицензионная учётка с таким ником.
  enabled: true

  # ЧТО ЭТА НАСТРОЙКА ДЕЛАЕТ НА САМОМ ДЕЛЕ — читать обязательно.
  #
  # Пароль пропускается ТОЛЬКО если UUID подключения совпал с настоящим UUID
  # из Mojang. Совпасть он может лишь тогда, когда игрока уже авторизовало
  # вышестоящее звено — прокси (Velocity/BungeeCord), проведшее для него
  # настоящую online-mode проверку. Сервер в offline-mode вычисляет UUID сам
  # из ника, и с настоящим он не совпадает никогда.
  #
  # Поэтому на голом offline-сервере без прокси эта настройка не сработает ни
  # разу — и это правильно. Само по себе «ник числится за лицензией» пароль
  # не отменяет: под чужим известным ником может зайти кто угодно.
  skip-password: true

  endpoint: "https://api.mojang.com/users/profiles/minecraft/"
  timeout-seconds: 5
  cache-minutes: 60

join-messages:
  # defer    — придержать сообщение о входе и показать после авторизации.
  #            Сообщение берётся уже готовым, после EssentialsX, поэтому его
  #            настройки (custom-join-message и прочее) продолжают работать.
  # suppress — не показывать вовсе, пока игрок не вошёл.
  # ignore   — не вмешиваться: сообщение появится сразу, до входа.
  mode: defer
