# Авторизация Aurum.
#
# Значения вне разумных границ плагин зажимает при старте и пишет об этом в
# лог — сервер не останется с таймаутом входа в ноль секунд из-за опечатки.

database:
  # Одна база на все серверы сети даёт сквозной вход: зарегистрировался на
  # выживании — зашёл на креатив тем же паролем. Ключ — UUID, он везде один.
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/aurum_auth"
  username: "aurum"
  password: ""
  table: "auth_accounts"
  # Размер пула соединений. Больше десятка нужно разве что при сотнях
  # одновременных заходов: соединение занято только на время запроса.
  pool-size: 6

login:
  # Сколько секунд даётся на ввод пароля до кика.
  timeout-seconds: 60
  # Окно сессии: переподключился в течение этого времени с того же адреса —
  # пароль не спрашиваем. 0 выключает сессии совсем.
  session-minutes: 15
  min-password-length: 8
  max-password-length: 64
  # Лёгкая защита от подбора. Полноценный антибот здесь не нужен — он стоит
  # на сетевом уровне; это просто базовая гигиена по конкретному аккаунту.
  max-attempts: 5
  lockout-minutes: 5
  attempt-delay-ms: 250
  # Стоимость bcrypt. 12 — примерно четверть секунды на ядро. Проверка идёт
  # вне главного потока, но выше 14 вход начинает ощущаться и так.
  bcrypt-cost: 12
  # Прятать от невошедшего игрока команды, которые ему всё равно запрещены.
  #
  # Клиент получает список команд сервера сразу при подключении и показывает
  # его по нажатию «/». Невошедшему это только мешает: выполнить он всё равно
  # ничего не может (запрет никуда не девается), а нужные /login и /register
  # теряются среди полусотни чужих строк. После входа полный список
  # отправляется клиенту заново — сам он этого не заметит.
  #
  # Это ВИДИМОСТЬ, а не защита: скрытую команду клиент по-прежнему может
  # отправить строкой, и отбивает её запрет, а не этот список.
  hide-other-commands: true

  # Сколько живёт токен сброса пароля, выданный из панели или командой
  # /auth reset. Столько, чтобы игрок успел зайти на сервер, и не столько,
  # чтобы забытый в переписке токен работал завтра.
  reset-token-minutes: 20

  # ПРАВО ОБХОДА ПАРОЛЯ — ЧИТАТЬ ПЕРЕД ВКЛЮЧЕНИЕМ.
  #
  # Когда включено, игрок с правом aurumauth.bypass входит без пароля.
  # На offline-сервере это опасно: UUID там вычисляется из ника, значит любой,
  # кто подключится под ником администратора, получит и его UUID, и его права
  # в LuckPerms — включая само право обойти пароль. То есть настройка,
  # задуманная как удобство для админа, превращается в способ зайти админом.
  #
  # Осмысленна она в основном за прокси, которое уже провело настоящую
  # online-mode авторизацию. Каждое срабатывание пишется в лог.
  permission-bypass: false

premium:
  # Спрашивать у Mojang, существует ли лицензионная учётка с таким ником.
  enabled: true

  # ЧТО ЭТА НАСТРОЙКА ДЕЛАЕТ НА САМОМ ДЕЛЕ — читать обязательно.
  #
  # Пароль пропускается ТОЛЬКО если UUID подключения совпал с настоящим UUID
  # из Mojang. Совпасть он может лишь тогда, когда игрока уже авторизовало
  # вышестоящее звено — прокси (Velocity/BungeeCord), проведшее для него
  # настоящую online-mode проверку. Сервер в offline-mode вычисляет UUID сам
  # из ника, и с настоящим он не совпадает никогда.
  #
  # Поэтому на голом offline-сервере без прокси эта настройка не сработает ни
  # разу — и это правильно. Само по себе «ник числится за лицензией» пароль
  # не отменяет: под чужим известным ником может зайти кто угодно.
  skip-password: true

  endpoint: "https://api.mojang.com/users/profiles/minecraft/"
  timeout-seconds: 5
  cache-minutes: 60

# Двухфакторка по коду из приложения (Google Authenticator, Aegis, 1Password
# и любое другое — стандарт один, RFC 6238).
#
# ВКЛЮЧАЕТ ЕЁ САМ ИГРОК командой /2fa enable, и настройки «включить всем» здесь
# нет намеренно: принудительная двухфакторка на игровом сервере означает, что
# часть игроков перестанет заходить, а часть потеряет доступ вместе с телефоном.
# Администратор может снять её потерявшему телефон: /auth 2fa-off <ник>.
totp:
  # Как плагин назовётся в приложении.
  issuer: "Aurum"
  # Допуск на расхождение часов, в интервалах по 30 секунд. Один в каждую
  # сторону — общепринятый компромисс: телефоны расходятся на секунды, а
  # каждый лишний интервал втрое увеличивает окно, в котором годен
  # подсмотренный код.
  window: 1

# История входов: и удачные попытки, и нет. Смотреть — /auth history <ник>.
history:
  # Через сколько дней записи выбрасываются. Бесконечная история — это
  # таблица, которая растёт весь срок жизни сервера.
  keep-days: 90

# Как этот сервер называется в истории входов. База одна на всю сеть, и без
# имени непонятно, где именно игрок заходил.
server-id: "survival"

join-messages:
  # Как обращаться с ЧУЖИМ сообщением о входе (ванильным или от EssentialsX),
  # пока игрок не авторизовался.
  #
  # defer    — придержать и показать после авторизации. Сообщение берётся уже
  #            готовым, после EssentialsX, поэтому его настройки
  #            (custom-join-message и прочее) продолжают работать.
  # suppress — не показывать вовсе, пока игрок не вошёл.
  # ignore   — не вмешиваться: сообщение появится сразу, до входа.
  mode: defer

# Свои тексты — на случай, когда на сервере нет EssentialsX или другого плагина
# для этого.
#
# ВСЁ ВЫКЛЮЧЕНО ПО УМОЛЧАНИЮ, и это важно: если EssentialsX стоит, он уже
# показывает свои сообщения о входе и выходе, и включённые здесь дадут второе
# сообщение подряд. Включайте, только если больше этим никто не занимается.
#
# Цвета — привычными кодами вида &a, &e, &6 (как в конфигах EssentialsX).
# Плейсхолдеры: {player} — ник, {online} — сколько сейчас в сети,
# {max} — вместимость сервера. Неизвестный плейсхолдер останется в тексте
# как есть — так опечатку видно сразу.
messages:
  join:
    enabled: false
    text: "&e{player} присоединился"
    # Показывается вместо обычного тому, кто только что зарегистрировался.
    first-time: "&6Встречайте нового игрока: &e{player}&6!"
  quit:
    enabled: false
    text: "&e{player} вышел"
  # Приветствие лично вошедшему: показывается ему одному после входа.
  motd:
    enabled: false
    lines:
      - "&aДобро пожаловать, &f{player}&a!"
      - "&7Сейчас на сервере: &f{online}&7/&f{max}"

# КАК ВЫГЛЯДИТ ПРОСЬБА ВОЙТИ.
#
# Почему это не одна строчка в чате. EssentialsX показывает свой MOTD сразу
# после входа игрока, и показывает его не событием, а прямой отправкой текста
# — перехватить или отложить такое в Bukkit нечем, события «игроку пришёл
# текст» не существует. MOTD в несколько строк уносит подсказку вверх раньше,
# чем её успевают прочитать, и человек остаётся стоять, не понимая, что делать.
#
# Поэтому подсказка идёт тремя каналами сразу: title поперёк экрана (его чат
# не двигает вообще), строка над горячей панелью и строка в чате. И
# повторяется, пока игрок не войдёт.
#
# Если чужой MOTD мешает и сам по себе — у EssentialsX для этого есть своя
# настройка motd-delay (в миллисекундах; отрицательное значение выключает MOTD
# совсем). Чужой конфиг мы не трогаем.
#
# Цвета — привычными кодами вида &a, &e, &6. Плейсхолдеры: {player} — ник,
# {seconds} — сколько секунд осталось до кика, {online} и {max} — сколько
# игроков сейчас и сколько вмещается.
#
# ПУСТАЯ СТРОКА выключает конкретную часть, не трогая остальные: например,
# title: "" оставит только подзаголовок.
prompt:
  # Общий префикс всех сообщений плагина и цвет их текста. Раньше текст был
  # просто белым и терялся среди чужих сообщений.
  prefix: "&6[&eВход&6]&r "
  # Один код цвета, от &0 до &f. Негодное значение молча станет белым.
  text-color: "&f"

  title:
    enabled: true
    fade-in-ms: 200
    # Сколько title висит. Если он гаснет раньше следующего повтора, подсказка
    # мигает, поэтому значение меньше периода повтора плагин поднимает сам.
    stay-ms: 6000
    fade-out-ms: 400

  # Строка над горячей панелью: всегда на виду и не мешает читать чат.
  action-bar: true
  # Строка в чате — для тех, у кого title отключён в настройках клиента.
  chat: true

  # Как часто повторять title и строку над панелью. 0 — показать один раз.
  repeat-seconds: 4
  # Как часто повторять строку в чате. Реже остальных намеренно: чаще — это
  # уже стена текста, из-за которой не видно ни MOTD, ни своего набора.
  # 0 — отправить в чат только один раз, при заходе.
  chat-reminder-seconds: 15

  # Ник уже зарегистрирован — нужен пароль.
  login:
    title: "&c&lВОЙДИТЕ"
    subtitle: "&fнапишите в чат &e/login <пароль>"
    action-bar: "&e» &fнапишите &e/login <пароль> &7({seconds} с) &e«"
    chat: "&7Этот ник уже зарегистрирован. &aВойдите: &f/login <пароль>"

  # Ник видят впервые.
  register:
    title: "&a&lРЕГИСТРАЦИЯ"
    subtitle: "&fнапишите в чат &e/register <пароль> <пароль>"
    action-bar: "&e» &fнапишите &e/register <пароль> <пароль> &7({seconds} с) &e«"
    chat: "&aДобро пожаловать, &f{player}&a! Зарегистрируйтесь: &f/register <пароль> <пароль ещё раз>"

  # Пароль принят, осталась двухфакторка.
  totp:
    title: "&6&lКОД ИЗ ПРИЛОЖЕНИЯ"
    subtitle: "&fнапишите в чат &e/2fa <код>"
    action-bar: "&e» &fнапишите &e/2fa <код> &7({seconds} с) &e«"
    chat: "&6Остался код двухфакторки: &f/2fa <код>"

  # Токен сброса принят, ждём новый пароль.
  new-password:
    title: "&b&lНОВЫЙ ПАРОЛЬ"
    subtitle: "&fнапишите в чат &e/reset <пароль> <пароль>"
    action-bar: "&e» &fнапишите &e/reset <пароль> <пароль> &7({seconds} с) &e«"
    chat: "&bПридумайте новый пароль: &f/reset <пароль> <пароль ещё раз>"
