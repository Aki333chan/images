# English is the safe fallback. Supported: en, ru, pl.
language: en

economy:
  # passive: observe Vault only. shadow: prepare and verify migration while the
  # old provider stays live. active: AurumCore becomes the economy provider.
  mode: passive
  # Vault and legacy plugins see only this currency. Aurum API consumers can
  # address every enabled currency explicitly.
  primary-currency: coins
  currencies:
    coins:
      display-name: Coins
      symbol: "$"
      scale: 2
      enabled: true
    # tokens:
    #   display-name: Tokens
    #   symbol: "✦"
    #   scale: 0
    #   enabled: true
  # Legacy single-currency keys are retained as a fallback for old configs.
  currency:
    id: coins
    display-name: Coins
    symbol: "$"
    # Allowed digits after the decimal point, 0..8.
    scale: 2

exchange:
  # Rules may be prepared while disabled. NPC exchangers will call the same
  # quote + atomic exchange API after they are implemented.
  enabled: false
  quote-ttl-seconds: 30
  bootstrap-on-empty: true
  max-rules: 100
  rules: {}
  # Example after enabling a second currency:
  # rules:
  #   coins-to-tokens:
  #     from: coins
  #     to: tokens
  #     rate: "0.01"
  #     fee-rate: "0.02"
  #     minimum: "100.00"
  #     maximum: "10000.00"
  #     settlement: MINT_BURN
  #     priority: 100
  #     enabled: false

passive:
  # Refresh cached online balances for commands, TAB and other placeholders.
  refresh-ticks: 100

migration:
  # Vault balance reads run on the server thread for provider compatibility,
  # but are spread across ticks to avoid a migration-time MSPT spike.
  players-per-tick: 20

active:
  # Keep this enabled for an Essentials/Vault migration. Disable only for a
  # deliberately fresh economy with no legacy balances to preserve.
  require-verified-migration: true
  # Cached global treasury/supply placeholders are refreshed asynchronously.
  global-refresh-ticks: 100

database:
  # Safe default for the first install. Enable after filling the connection.
  # Required by shadow and active modes. Passive only initializes the schema.
  enabled: false
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/aurum_core"
  username: "aurum"
  password: "change-me"
  pool-size: 3

financial-policies:
  # Master switch. Rules can be prepared while this is false; no transaction
  # is affected until it is enabled and the server is restarted.
  enabled: false
  # YAML rules are imported only when the DB contains no rules. Afterwards
  # MariaDB revisions are authoritative and /apolicy manages them.
  bootstrap-on-empty: true
  max-rules: 100
  rules:
    market-sales-tax:
      kind: TAX
      handler-version: 1
      categories: [NPC_PURCHASE, NPC_SALE]
      rate: "0.05"
      mode: INCLUDED
      recipient-type: TREASURY
      recipient-id: global
      priority: 100
      enabled: false
    player-payment-limit:
      kind: LIMIT
      handler-version: 1
      categories: [PLAYER_PAYMENT]
      minimum: "1.00"
      maximum: "1000000.00"
      priority: 1000
      enabled: false

payments:
  enabled: true
  minimum: "0.01"
  maximum: "1000000.00"
  cooldown-seconds: 2

holds:
  # Maximum lifetime requested by Arena, Slots, NPC or future trade sagas.
  max-ttl-seconds: 300

trading:
  enabled: false
  invite-timeout-seconds: 30
  session-timeout-seconds: 300
  require-final-confirmation: true
  # Items that cannot be delivered stay claimable; they are never dropped.
  claim-expire-days: 30
