# English is the safe fallback. Supported: en, ru, pl.
language: en

economy:
  # passive: observe Vault only. shadow: prepare and verify migration while the
  # old provider stays live. active: AurumCore becomes the economy provider.
  mode: passive
  # Vault and legacy plugins see only this currency. Aurum API consumers can
  # address every enabled currency explicitly.
  primary-currency: coins
  currencies:
    coins:
      display-name: Coins
      symbol: "$"
      scale: 2
      enabled: true
    # tokens:
    #   display-name: Tokens
    #   symbol: "✦"
    #   scale: 0
    #   enabled: true
  # Legacy single-currency keys are retained as a fallback for old configs.
  currency:
    id: coins
    display-name: Coins
    symbol: "$"
    # Allowed digits after the decimal point, 0..8.
    scale: 2

exchange:
  # Rules may be prepared while disabled. NPC exchangers will call the same
  # quote + atomic exchange API after they are implemented.
  enabled: false
  quote-ttl-seconds: 30
  bootstrap-on-empty: true
  max-rules: 100
  rules: {}
  # Example after enabling a second currency:
  # rules:
  #   coins-to-tokens:
  #     from: coins
  #     to: tokens
  #     rate: "0.01"
  #     fee-rate: "0.02"
  #     minimum: "100.00"
  #     maximum: "10000.00"
  #     settlement: MINT_BURN
  #     priority: 100
  #     enabled: false

passive:
  # Refresh cached online balances for commands, TAB and other placeholders.
  refresh-ticks: 100

migration:
  # Vault balance reads run on the server thread for provider compatibility,
  # but are spread across ticks to avoid a migration-time MSPT spike.
  players-per-tick: 20

active:
  # Keep this enabled for an Essentials/Vault migration. Disable only for a
  # deliberately fresh economy with no legacy balances to preserve.
  require-verified-migration: true
  # Cached global treasury/supply placeholders are refreshed asynchronously.
  global-refresh-ticks: 100

database:
  # Safe default for the first install. Enable after filling the connection.
  # Required by shadow and active modes. Passive only initializes the schema.
  enabled: false
  jdbc-url: "jdbc:mariadb://127.0.0.1:3306/aurum_core"
  username: "aurum"
  password: "change-me"
  pool-size: 3

financial-policies:
  # Master switch. Rules can be prepared while this is false; no transaction
  # is affected until it is enabled and the server is restarted.
  enabled: false
  # YAML rules are imported only when the DB contains no rules. Afterwards
  # MariaDB revisions are authoritative and /apolicy manages them.
  bootstrap-on-empty: true
  max-rules: 100
  rules:
    market-sales-tax:
      kind: TAX
      handler-version: 1
      categories: [NPC_PURCHASE, NPC_SALE]
      rate: "0.05"
      mode: INCLUDED
      recipient-type: TREASURY
      recipient-id: global
      priority: 100
      enabled: false
    player-payment-limit:
      kind: LIMIT
      handler-version: 1
      categories: [PLAYER_PAYMENT]
      minimum: "1.00"
      maximum: "1000000.00"
      priority: 1000
      enabled: false

payments:
  enabled: true
  minimum: "0.01"
  maximum: "1000000.00"
  cooldown-seconds: 2

holds:
  # Maximum lifetime requested by Arena, Slots, NPC or future trade sagas.
  max-ttl-seconds: 300

claims:
  # Durable delivery of what a player has already paid for.
  #
  # A hold protects the money half of an operation; a claim protects the half
  # that happens in Minecraft. Items and post-purchase commands are recorded
  # before anything is handed over, so a crash halfway through resumes at the
  # step that never ran instead of giving goods away for free or losing a
  # command silently.

  # How long one server may keep a claim leased for delivery. This is also how
  # long a CRASHED server keeps the player's goods locked away, so keep it
  # short: a live delivery renews the lease as it makes progress.
  max-lease-seconds: 120

  # Failed deliveries that are handed back this many times stop retrying and
  # go to quarantine for /aurum claims. Retrying for ever would mean an
  # unfixable delivery failing on every single login, forever, in the log.
  max-attempts: 5

trading:
  # Guaranteed player-to-player trade: /trade <player>.
  #
  # OFF BY DEFAULT because it changes how items move on the server. Turn it on
  # deliberately, not by upgrading.
  #
  # An item put on the table LEAVES the player's inventory immediately and
  # exists only as a durable record in MariaDB. There is no second, live copy
  # anywhere: two places that can disagree about an item are two places that
  # can duplicate it.
  #
  # Every edit to either offer clears BOTH confirmations, and a confirmation
  # names the revision it was given for. That is what stops the oldest trade
  # scam there is — swapping the goods between the other player's look and
  # their click.
  #
  # Whatever ends a trade — settling, cancelling, timing out — ends it by owing
  # the goods to somebody through a delivery claim. Nothing is ever dropped on
  # the floor, and nothing waits on an inventory having room right now.
  enabled: false

  # How long an unanswered invitation stands.
  invite-timeout-seconds: 30

  # How long an open trade may sit idle. Real activity pushes this out: the
  # timeout is meant to clear abandoned tables, not to cut off two people who
  # are still arranging things.
  session-timeout-seconds: 300

  require-final-confirmation: true
  # Items that cannot be delivered stay claimable; they are never dropped.
  claim-expire-days: 30
