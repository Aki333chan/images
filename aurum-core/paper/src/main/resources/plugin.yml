name: AurumCore
version: '${version}'
main: ovh.aurumgg.core.paper.AurumCorePlugin
api-version: '26.2'
description: Shared economy and service foundation for the Aurum ecosystem.
author: Aurum
softdepend: [Vault, VaultUnlocked, PlaceholderAPI]
loadbefore: [Essentials, AddonsNPC, AurumSlots, AurumArena, AurumGuilds]

commands:
  aurum:
    description: AurumCore balance and diagnostics
    usage: /aurum <balance|status|treasury|migrate|economy|policy|exchange|claims>
    aliases: [acore]
  abal:
    description: Short form of /aurum balance
  atreasury:
    description: Short form of /aurum treasury
  amigrate:
    description: Short form of /aurum migrate
  aeco:
    description: Short form of /aurum economy
  apolicy:
    description: Short form of /aurum policy
  aexchange:
    description: Manage currency exchange rules
    usage: /aexchange <list|inspect|history|create|enable|disable|rate|range|schedule|settlement|condition|reserve|reload>
  pay:
    description: Safely transfer currency to another player
    usage: /pay <player> <amount> [reason]
  trade:
    description: Guaranteed trade with another player
    usage: /trade <player|accept|item|money <amount>|clear|confirm|cancel|view>
  apay:
    description: Conflict-free form of /pay
    usage: /apay <player> <amount> [reason]

permissions:
  aurum.balance:
    description: View own observed balance
    default: true
  aurum.pay:
    description: Transfer own currency to another player
    default: true
  aurum.balance.others:
    description: View another online player's observed balance
    default: op
  aurum.admin:
    description: View AurumCore diagnostics and treasury state
    default: op
    children:
      aurum.admin.migrate: true
      aurum.admin.economy: true
      aurum.admin.policy: true
      aurum.admin.exchange: true
      aurum.admin.claims: true
  aurum.admin.migrate:
    description: Create, import, verify and export economy migration snapshots
    default: op
  aurum.admin.economy:
    description: Manage the authoritative Aurum economy when active mode is enabled
    default: op
  aurum.admin.policy:
    description: Create, inspect, schedule and enable financial policies
    default: op
  aurum.admin.exchange:
    description: Create, inspect and change currency exchange rules
    default: op
  aurum.admin.claims:
    description: Inspect, retry and drop quarantined delivery claims
    default: op
  aurum.trade:
    description: Trade items and currency with another player
    default: true
