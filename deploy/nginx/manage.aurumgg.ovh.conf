# ШАГ 2 из 2: рабочий конфиг manage.aurumgg.ovh.
#
# Кладётся как /etc/nginx/sites-available/manage.aurumgg.ovh.conf
# (расширение .conf — для единообразия с pterodactyl.conf и wings.conf).
# Блок panel.aurumgg.ovh не трогается — nginx разводит их по server_name.
#
# Перед reload обязательно:  sudo nginx -t

server {
    listen 80;
    listen [::]:80;
    server_name manage.aurumgg.ovh;

    # Оставляем ACME-путь доступным по HTTP: иначе автопродление сломается.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 включается параметром listen — это форма для nginx < 1.25.1.
    # На VDS сейчас 1.24.0 (Ubuntu 24.04), где отдельной директивы
    # «http2 on;» ещё не существует и конфиг с ней не проходит nginx -t.
    # Если когда-нибудь обновитесь до 1.25.1+, nginx начнёт предупреждать,
    # что параметр устарел — тогда замените обе строки на «listen 443 ssl;»
    # плюс отдельную строку «http2 on;».
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name manage.aurumgg.ovh;

    ssl_certificate     /etc/letsencrypt/live/manage.aurumgg.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.aurumgg.ovh/privkey.pem;
    # Файлы кладёт certbot; они общие с panel.aurumgg.ovh и уже существуют.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Заголовки безопасности ---
    # Действуют на все location, где нет собственных add_header. Там, где
    # они есть, этот же файл подключается повторно — см. пояснение внутри.
    include /etc/nginx/conf.d/aurum-security-headers.inc;

    access_log /var/log/nginx/manage.aurumgg.ovh.access.log;
    error_log  /var/log/nginx/manage.aurumgg.ovh.error.log;

    # РАЗМЕР ЗАГРУЖАЕМОГО ФАЙЛА.
    #
    # Панель пропускает файл до 64 МиБ (MAX_TRANSFER_BYTES в packages/shared).
    # Здесь СОЗНАТЕЛЬНО чуть больше: если nginx срежет запрос первым, браузер
    # получит голый 413 с HTML-страницей, из которой человеку не понять ни
    # предела, ни что делать. Запас в два мегабайта отдаёт этот отказ панели —
    # она отвечает «файл больше 64 МиБ, загрузите по SFTP».
    #
    # Раньше здесь стояло 8m, и это был не запас, а потолок ВОСЕМЬ РАЗ ниже
    # обещанного панелью. Любая правка этого числа должна идти вместе с
    # MAX_TRANSFER_BYTES, иначе пределы снова разойдутся.
    client_max_body_size 66m;

    # --- Внутренний эндпоинт: наружу не публикуется ---
    # Сюда ходит только companion-плагин по адресу туннеля, напрямую в
    # 10.0.0.1:3001, минуя nginx. Из интернета он должен быть недоступен,
    # даже если кто-то узнает путь.
    location /api/internal/ {
        return 404;
    }

    # --- Вход: ограничение частоты попыток ---
    # Зона объявлена в conf.d/aurum-limits.conf.
    location = /api/auth/login {
        limit_req zone=aurum_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://10.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://10.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Консоль сервера может молчать между строками вывода.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- WebSocket панели (права, тикеты) ---
    # Именно /ws, а не /socket.io: путь задан в gateway явно.
    location /ws {
        proxy_pass http://10.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Соединение живёт долго и молчит, пока ничего не происходит.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Статика собранного фронтенда ---
    root /opt/aurum-panel/apps/web/dist;
    index index.html;

    # Файлы с хэшем в имени неизменяемы — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Обязательно: свой add_header выше отменил бы серверные.
        include /etc/nginx/conf.d/aurum-security-headers.inc;
        try_files $uri =404;
    }

    location / {
        # SPA: любой неизвестный путь отдаём index.html, роутинг на клиенте.
        try_files $uri $uri/ /index.html;
        # index.html кэшировать нельзя, иначе после деплоя браузер
        # продолжит грузить старые assets.
        add_header Cache-Control "no-store" always;
        # Обязательно: свой add_header выше отменил бы серверные.
        include /etc/nginx/conf.d/aurum-security-headers.inc;
    }
}
