# ШАГ 2 из 2: рабочий конфиг manage.aurumgg.ovh.
#
# Кладётся как /etc/nginx/sites-available/manage.aurumgg.ovh.
# Блок panel.aurumgg.ovh не трогается — nginx разводит их по server_name.
#
# Перед reload обязательно:  sudo nginx -t

server {
    listen 80;
    listen [::]:80;
    server_name manage.aurumgg.ovh;

    # Оставляем ACME-путь доступным по HTTP: иначе автопродление сломается.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manage.aurumgg.ovh;

    ssl_certificate     /etc/letsencrypt/live/manage.aurumgg.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manage.aurumgg.ovh/privkey.pem;
    # Файлы кладёт certbot; они общие с panel.aurumgg.ovh и уже существуют.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Аватары игроков грузятся с crafatar.com — иначе их заблокирует CSP.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://crafatar.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/manage.aurumgg.ovh.access.log;
    error_log  /var/log/nginx/manage.aurumgg.ovh.error.log;

    # Ответы API и загрузки не должны упираться в мелкий лимит.
    client_max_body_size 8m;

    # --- Внутренний эндпоинт: наружу не публикуется ---
    # Сюда ходит только companion-плагин по адресу туннеля, напрямую в
    # 10.0.0.1:3001, минуя nginx. Из интернета он должен быть недоступен,
    # даже если кто-то узнает путь.
    location /api/internal/ {
        return 404;
    }

    # --- Вход: ограничение частоты попыток ---
    # Зона объявлена в conf.d/aurum-limits.conf.
    location = /api/auth/login {
        limit_req zone=aurum_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://10.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://10.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Консоль сервера может молчать между строками вывода.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # --- WebSocket панели (права, тикеты) ---
    # Именно /ws, а не /socket.io: путь задан в gateway явно.
    location /ws {
        proxy_pass http://10.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Соединение живёт долго и молчит, пока ничего не происходит.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Статика собранного фронтенда ---
    root /opt/aurum-panel/apps/web/dist;
    index index.html;

    # Файлы с хэшем в имени неизменяемы — можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA: любой неизвестный путь отдаём index.html, роутинг на клиенте.
        try_files $uri $uri/ /index.html;
        # index.html кэшировать нельзя, иначе после деплоя браузер
        # продолжит грузить старые assets.
        add_header Cache-Control "no-store" always;
    }
}
