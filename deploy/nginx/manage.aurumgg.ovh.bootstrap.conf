# ШАГ 1 из 2: временный HTTP-блок только для выпуска сертификата.
#
# Кладётся как /etc/nginx/sites-available/manage.aurumgg.ovh и включается
# симлинком. Существующий блок panel.aurumgg.ovh не затрагивается: nginx
# выбирает блок по server_name, а этот отвечает только на manage.aurumgg.ovh.
#
# После выпуска сертификата этот файл заменяется на manage.aurumgg.ovh.conf.

server {
    listen 80;
    listen [::]:80;
    server_name manage.aurumgg.ovh;

    # Каталог для ACME-проверки. Отдельный от того, что использует
    # Pterodactyl, чтобы ничего у неё не задеть.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Пока сертификата нет — на всё остальное отвечаем заглушкой,
    # а не отдаём панель по незашифрованному соединению.
    location / {
        return 503 "Aurum Panel: идёт настройка\n";
        add_header Content-Type text/plain always;
    }
}
