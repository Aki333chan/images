# Кладётся как /etc/nginx/conf.d/aurum-limits.conf — НОВЫЙ файл,
# существующие конфиги не редактируются.
#
# Зона для ограничения частоты попыток входа. Директива limit_req_zone
# работает только на уровне http, поэтому её нельзя положить внутрь
# server-блока manage.aurumgg.ovh.
#
# 10 запросов в минуту на IP: живому человеку хватит с запасом,
# перебору паролей — нет. Панель дополнительно защищена argon2 и 2FA.
limit_req_zone $binary_remote_addr zone=aurum_login:1m rate=10r/m;
