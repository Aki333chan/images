# Redis для панели Aurum — ОТДЕЛЬНЫЙ инстанс, не трогает Redis Pterodactyl.
# Кладётся в /etc/redis/aurum.conf

# Только localhost: наружу и в туннель этот Redis не смотрит.
bind 127.0.0.1 -::1
port 6380
protected-mode yes

# Свой pid/каталог данных, чтобы не пересекаться со штатным инстансом.
pidfile /run/redis-aurum/redis.pid
dir /var/lib/redis-aurum
dbfilename aurum-dump.rdb

# Пустое значение = писать в stdout, откуда systemd забирает всё в журнал:
#   journalctl -u aurum-redis -f
# Своего файла намеренно нет по двум причинам:
#   1) юнит работает с ProtectSystem=strict, и любой новый путь для записи
#      пришлось бы отдельно открывать в ReadWritePaths;
#   2) штатный logrotate Ubuntu ротирует /var/log/redis/*.log и шлёт сигнал
#      по pid-файлу основного инстанса — наш процесс сигнала не получил бы
#      и продолжил писать в уже удалённый файл.
logfile ""

# BullMQ хранит очереди в Redis: терять их при рестарте нежелательно,
# поэтому оставляем снапшоты. AOF для наших объёмов избыточен.
save 900 1
save 300 10

# ВАЖНО: очереди нельзя вытеснять по памяти, иначе задачи молча пропадут.
# Лучше получить ошибку записи, чем потерять задание.
maxmemory 256mb
maxmemory-policy noeviction

# Команды, которыми легко выстрелить себе в ногу на живой системе.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
