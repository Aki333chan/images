<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      width=device-width + initial-scale=1 — обязательный минимум, без него
      iOS рисует страницу в виртуальном окне 980 px и ужимает её целиком.
      Здесь он был и раньше, так что причина проблем на iPhone была не в нём.

      viewport-fit=cover включает env(safe-area-inset-*) в CSS: без него
      значения нулевые и отступы под «чёлку» не работают.

      Максимальный масштаб намеренно НЕ ограничен: user-scalable=no и
      maximum-scale ломают возможность приблизить экран тем, кому это нужно
      по зрению. Автозум при фокусе в поле лечится размером шрифта 16 px
      (см. ui.tsx), а не запретом масштабирования.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#161826" />
    <link rel="icon" type="image/png" sizes="128x128" href="/logo-128.png" />
    <link rel="apple-touch-icon" href="/logo-256.png" />
    <title>Aurum Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
