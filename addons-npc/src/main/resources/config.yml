# Interface language: en, pl or ru.
language: en

# General plugin behaviour. NPCs, shops and buyers are stored in separate YAML files.
settings:
  interaction-distance: 5.0
  default-cooldown-seconds: 1.0
  default-visibility-range: 48.0
  default-name-visibility-range: 24.0
  default-look-mode: HEAD
  cancel-left-click-damage: true
  protect-npcs: true
  look-task-period-ticks: 10
  # Lets world managers finish startup; worlds loaded later are synchronized by an event listener too.
  startup-spawn-delay-ticks: 20
  name-height-offset: 0.35
  ignore-worldguard-spawn-flags: true
  debug: false

economy:
  # Cross-system NPC operations are reserved in AurumCore before items or bonuses change.
  hold-ttl-seconds: 300
  recovery-retry-seconds: 20

  # How long a promised sale stays valid before it is cancelled untouched.
  #
  # This protects the PLAYER, not the money. A sale clicked just before a crash
  # and resumed a week later would take items the player has long since decided
  # to keep. Past this deadline nothing is taken and nothing is paid.
  #
  # Purchases have no such deadline: the player already paid, and what they paid
  # for is owed to them however long it takes to hand over.
  sale-deadline-seconds: 900
