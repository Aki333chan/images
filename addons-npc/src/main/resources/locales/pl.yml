command-help:
  - "&6--- Komendy AddonsNPC ---"
  - "&e/npc create <id> [nazwa] &7- utwórz w swojej pozycji"
  - "&e/npc delete|move|tp|enable|disable <id>"
  - "&e/npc cleanup <id|orphans> &7- usuń osierocone byty"
  - "&e/npc name <id> <nazwa> &7/ &e/npc description <id> <tekst|clear>"
  - "&e/npc type <id> <typ-bytu> &7- manekin, wieśniak, zwierzę lub mob"
  - "&e/npc skin <id> <player|url|clear> [wartość]"
  - "&e/npc equipment <id> <right|left> <materiał|hand|clear>"
  - "&e/npc rotation <id> <set|reset> &7- zapisz lub przywróć kierunek"
  - "&e/npc message <add|remove|clear|mode|list> <id> ..."
  - "&e/npc action <add|remove|clear|list> <id> ..."
  - "&e/npc set <id> <cooldown|permission|click|look|lookrange|lookmode|visibility|namerange|pose> <wartość>"
  - "&e/npc shop <create|delete|list|open|offer|quantity|discount|remove> ..."
  - "&e/npc buyer <create|delete|list|open|title|size|offer|price|bulk|bonus|match|name|lore|command|permission|remove> ..."
  - "&e/npc guildtrader <create|delete|list|open|title|size|rank|offer|price|icon|name|lore|permission|remove> ..."
  - "&e/npc exchanger <create|delete|list|open|title|size|offer|pair|amount|icon|name|lore|permission|remove> ..."
  - "&e/npc list &7/ &e/npc info <id> &7/ &e/npc reload"
