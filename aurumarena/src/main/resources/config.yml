# Interface language: en, pl or ru.
language: en

economy:
  # true — денежный режим через AurumCore. Ключ назван use_vault по историческим
  # причинам: Vault за ним больше не стоит, переименование сломало бы старые
  # конфиги. При недоступном Core ставки блокируются без отката на предметы.
  use_vault: false
  vault_symbol: "$"
  min_vault_bet: 3.0
  main_currency: GOLD_INGOT
  sub_currency: GOLD_NUGGET
  # Сколько секунд держится резерв денег, пока идёт приём ставки.
  # Резерв живёт секунды, а не между перезапусками.
  hold-ttl-seconds: 120
  commission:
    # Процент казино со ставок. Пусто — берётся из settings.casino_commission_percent.
    percent: 0.0
    # Куда уходит комиссия:
    #   treasury      — в казну сервера (TREASURY:global), доход сервера;
    #   champion-pool — в чемпионский пул этой же арены: сервер на комиссии не
    #                   зарабатывает, она копится и достаётся победителям финала.
    destination: treasury
    # Брать ли комиссию ещё и с ЧЕМПИОНСКОГО ПУЛА. По умолчанию нет: пул
    # собран взносами игроков именно на приз. Ставок это не касается — с них
    # комиссия берётся всегда, в том числе в финальном бою.
    # При destination: champion-pool игнорируется: деньги ушли бы в тот же пул.
    apply-to-champion-pool: false

database:
  # sqlite работает без внешней БД; mariadb подходит для базы из Pterodactyl.
  type: sqlite
  sqlite:
    file: statistics.db
  mariadb:
    # Необязательно: полный jdbc:mariadb://... URL. Если заполнен, host/port/database/use_ssl не используются.
    jdbc_url: ""
    host: 127.0.0.1
    port: 3306
    database: gladiatorarena
    username: gladiatorarena
    password: change_me
    use_ssl: false
    pool_size: 5
    connection_timeout_ms: 10000

settings:
  # Восстанавливать сохранённый инвентарь при следующем входе после сбоя сервера.
  recover_inventories_on_join: true
  # Возвращать незавершённые ставки после перезапуска.
  refund_interrupted_bets: true
  # Максимальный размер одной команды.
  max_team_size_limit: 20
  betting_seconds: 45
  countdown_seconds: 5
  combat_log_is_loss: true
  boundary_leave_is_loss: true
  casino_commission_percent: 0.0
  min_bet: 0.1
  max_bet_per_player: 1000000.0
  rewards:
    # Значения по умолчанию для НОВЫХ арен. У каждой арены после создания появляются свои параметры ниже в arenas.<id>.
    # Награда выдаётся целиком каждому участнику победившей команды; 0 отключает её.
    winner_experience: 0
    final_winner_experience: 0
    # points — обычные очки полосы опыта, levels — целые уровни.
    experience_mode: points
  sidebar:
    # Paper 26.2: скрывать красные номера строк справа. На Spigot этот API отсутствует.
    hide_scores: true
  holograms:
    # false — текст перекрывается стенами и другими непрозрачными блоками.
    see_through_walls: false
    # Фактическая дальность отображения в блоках для всех голограмм арены.
    view_distance_blocks: 32.0
    # Масштаб голограмм над воронками ставок.
    betting_scale: 0.65
  spectators:
    enabled: true
    restore_on_join: true

arenas: {}
